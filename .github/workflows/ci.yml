name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest python-docx
      - name: Compile check
        run: python -m compileall -q 语文AI教学智能体
      - name: Run smoke tests
        run: pytest tests/ -v
